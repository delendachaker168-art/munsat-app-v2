plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.munsataudiocapture'
version = '1.0.0'

android {
  namespace "expo.modules.munsataudiocapture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    minSdkVersion 24
  }
}

dependencies {
  implementation 'com.alphacephei:vosk-android:0.3.70@aar'
  implementation 'net.java.dev.jna:jna:5.17.0@aar'
}
